<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="حاسبة وقت بسيطة لحساب الوقت بعد 60 أو 90 دقيقة." />
  <title>حاسبة الوقت</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="card">
      <div class="header">
        <div class="icon">⏱</div>
        <h1>حاسبة الوقت</h1>
        <p>أدخل الوقت واختر المدة</p>
      </div>

      <label>الوقت</label>

      <div class="time-picker" aria-label="اختيار الوقت">
        <select id="hourSelect" aria-label="الساعة"></select>
        <span class="colon">:</span>
        <select id="minuteSelect" aria-label="الدقائق"></select>
        <select id="periodSelect" aria-label="الفترة">
          <option value="AM">AM</option>
          <option value="PM">PM</option>
        </select>
        <span class="clock-icon" aria-hidden="true">◷</span>
      </div>

      <div class="buttons">
        <button type="button" data-minutes="60">+60 دقيقة</button>
        <button type="button" data-minutes="90">+90 دقيقة</button>
        <button type="button" data-minutes="120">+120 دقيقة</button>
      </div>

      <section class="result" aria-live="polite">
        <span>الوقت الناتج</span>
        <strong id="result">—</strong>
      </section>

      <button id="resetButton" class="reset" type="button">إعادة ضبط</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
